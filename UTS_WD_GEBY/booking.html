<section class="booking-page">

<h1>Booking Tukang</h1>

<div class="booking-container">

<div class="booking-left">

<img src="tukang ac.png" alt="Booking Tukang">

<h2>Budi AC</h2>

<p>⭐ 4.8 (500 Review)</p>

<p>Service AC • Instalasi • Isi Freon</p>

</div>


<div class="booking-right">

<label>Nama Lengkap</label>

<input type="text" id="nama">

<label>Nomor HP</label>

<input type="text" id="hp">

<label>Alamat</label>

<textarea id="alamat"></textarea>

<label>Tanggal Booking</label>

<input type="date" id="tanggal">

<label>Jam Booking</label>

<input type="time" id="jam">

<label>Jenis Layanan</label>

<select id="layanan">

<option>Service AC</option>

<option>Isi Freon</option>

<option>Cuci AC</option>

<option>Bongkar Pasang AC</option>

</select>

<label>Catatan</label>

<textarea id="catatan"></textarea>

<button onclick="booking()">Booking Sekarang</button>
